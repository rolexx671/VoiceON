name: Проверка VoiceON
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Сборка и тесты
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Проверка скриптов
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Сборка Swift
        run: swift build -c release
      - name: Модульные тесты
        run: swift test --skip ModelAvailabilityTests
