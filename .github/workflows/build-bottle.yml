name: Сборка установочного образа VoiceON
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка CMake
        run: command -v cmake || brew install cmake
      - name: Сборка автономного образа
        run: bash scripts/build-dmg.sh
      - name: Сохранение установочного образа
        uses: actions/upload-artifact@v4
        with:
          name: VoiceON-macOS-Apple-Silicon
          path: |
            dist/VoiceON.dmg
            dist/VoiceON.dmg.sha256
