name: Проверка русской документации
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка обязательных документов
        run: test -s README.md && test -s docs/install-guide.md && test -s LICENSE
